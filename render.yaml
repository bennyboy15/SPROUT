services:
  - type: web
    name: sprout
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    envVars:
      # Vite 8 needs Node 20.19+.
      - key: NODE_VERSION
        value: "24"
      # VITE_* values are baked into the bundle at build time — redeploy after changing them.
      # sync: false means Render asks for the value when the Blueprint is created.
      # Public URL of the HONO_MOISTURE API. Its FRONTEND_URL must be this site's URL.
      - key: VITE_API_URL
        sync: false
    routes:
      # Client-side routing: serve index.html for deep links like /plants/3.
      - type: rewrite
        source: /*
        destination: /index.html
